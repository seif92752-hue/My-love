<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-love App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 50%, #ffe5ec 100%);
            min-height: 100vh;
            color: #4a4a4a;
            padding: 20px;
            padding-bottom: 50px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #d80032;
            margin-bottom: 15px;
            font-size: 28px;
        }
        .counter-box {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #ff4b72;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .section {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .section h2 {
            color: #ff4b72;
            font-size: 18px;
            margin-bottom: 15px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ffd1dc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }
        textarea {
            height: 90px;
            resize: vertical;
        }
        button {
            background-color: #ff4b72;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #e03e62;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .note-card, .image-card {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            position: relative;
            border: 1px solid #ffe5ec;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            word-break: break-word;
        }
        .note-card h3 {
            color: #d80032;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .note-card p {
            font-size: 14px;
            color: #666;
        }
        .image-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }
        .delete-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #ff4b72;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            cursor: pointer;
            font-size: 11px;
            line-height: 22px;
            text-align: center;
            padding: 0;
            z-index: 2;
        }
        .audio-player {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>موقعنا المميز ❤️</h1>
        
        <!-- قسم العداد (التاريخ) -->
        <div class="counter-box" id="relationshipCounter">
            جاري حساب الأيام الجميلة...
        </div>

        <!-- قسم أغنية الخلفية -->
        <div class="section" style="text-align: center;">
            <h2>أغنية الخلفية 🎶</h2>
            <!-- تقدر تحط رابط الأغنية المفضل ليك جوه الـ src -->
            <audio controls loop class="audio-player">
                <source src="" type="audio/mp3">
                متصفحك لا يدعم مشغل الصوت
            </audio>
        </div>

        <!-- قسم الملاحظات والرسائل -->
        <div class="section">
            <h2>إضافة ملاحظة أو رسالة</h2>
            <input type="text" id="noteTitle" placeholder="عنوان الرسالة...">
            <textarea id="noteContent" placeholder="اكتب كلامك هنا..."></textarea>
            <button onclick="saveNote()">حفظ الرسالة</button>
            <div id="notesGrid" class="grid-container"></div>
        </div>

        <!-- قسم الصور -->
        <div class="section">
            <h2>صور الذكريات</h2>
            <input type="file" id="imageInput" accept="image/*" multiple onchange="uploadImages(event)">
            <div id="imageGallery" class="grid-container"></div>
        </div>
    </div>

    <!-- Firebase Code -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات فايربيس
        const firebaseConfig = {
            authDomain: "my-love-app-c8f35.firebaseapp.com",
            projectId: "my-love-app-c8f35",
            storageBucket: "my-love-app-c8f35.appspot.com",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // عداد التاريخ (احسب الأيام من تاريخ البداية اللي تحبه)
        function updateCounter() {
            // تقدر تغير التاريخ ده لتاريخ بدايتكم الحقيقي (مثلاً سنة 2024, شهر 11, يوم 28)
            const startDate = new Date("2024-11-28");
            const currentDate = new Date();
            const diffTime = Math.abs(currentDate - startDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            const counterElement = document.getElementById('relationshipCounter');
            if (counterElement) {
                counterElement.innerText = `مع بعض من ${diffDays} يوم ❤️`;
            }
        }
        updateCounter();

        // 1. الملاحظات
        window.saveNote = async function() {
            const titleInput = document.getElementById('noteTitle');
            const contentInput = document.getElementById('noteContent');
            
            if (!titleInput.value || !contentInput.value) {
                alert('برجاء كتابة العنوان والمحتوى');
                return;
            }

            try {
                await addDoc(collection(db, "notes"), {
                    title: titleInput.value,
                    content: contentInput.value,
                    timestamp: Date.now()
                });
                titleInput.value = '';
                contentInput.value = '';
                loadNotes();
            } catch (error) {
                console.error("خطأ في الحفظ:", error);
            }
        };

        window.loadNotes = async function() {
            const grid = document.getElementById('notesGrid');
            if (!grid) return;
            grid.innerHTML = '';
            try {
                const querySnapshot = await getDocs(collection(db, "notes"));
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'note-card';
                    card.innerHTML = `
                        <button class="delete-btn" onclick="deleteNote('${docSnap.id}')">X</button>
                        <h3>${data.title}</h3>
                        <p>${data.content}</p>
                    `;
                    grid.prepend(card);
                });
            } catch (error) {
                console.error("خطأ في التحميل:", error);
            }
        };

        window.deleteNote = async function(id) {
            try {
                await deleteDoc(doc(db, "notes", id));
                loadNotes();
            } catch (error) {
                console.error("خطأ في الحذف:", error);
            }
        };

        // 2. الصور
        window.uploadImages = async function(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            for (let file of files) {
                const reader = new FileReader();
                reader.onload = async function(event) {
                    try {
                        await addDoc(collection(db, "images"), {
                            url: event.target.result,
                            timestamp: Date.now()
                        });
                        loadImages();
                    } catch (error) {
                        console.error("خطأ في الرفع:", error);
                    }
                };
                reader.readAsDataURL(file);
            }
        };

        window.loadImages = async function() {
            const gallery = document.getElementById('imageGallery');
            if (!gallery) return;
            gallery.innerHTML = '';
            try {
                const querySnapshot = await getDocs(collection(db, "images"));
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const imgCard = document.createElement('div');
                    imgCard.className = 'image-card';
                    imgCard.innerHTML = `
                        <button class="delete-btn" onclick="deleteImage('${docSnap.id}')">X</button>
                        <img src="${data.url}" alt="صورة">
                    `;
                    gallery.prepend(imgCard);
                });
            } catch (error) {
                console.error("خطأ في تحميل الصور:", error);
            }
        };

        window.deleteImage = async function(id) {
            try {
                await deleteDoc(doc(db, "images", id));
                loadImages();
            } catch (error) {
                console.error("خطأ في حذف الصورة:", error);
            }
        };

        // التشغيل التلقائي عند الفتح
        document.addEventListener('DOMContentLoaded', () => {
            loadNotes();
            loadImages();
        });
    </script>
</body>
</html>
