<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-love App</title>
    <style>
        body {
            background: linear-gradient(135deg, #ffefeec 0%, #ffc2d1 50%, #ffefec 100%);
            min-height: 100vh;
            color: #4a4a4a;
            padding-bottom: 50px;
            font-family: 'Cairo', sans-serif;
            position: relative;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .section {
            margin-bottom: 30px;
            padding: 15px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        button {
            background-color: #ff4b72;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
        }
        button:hover {
            background-color: #e03e62;
        }
        .note-card, .image-card {
            background: #fff5f7;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            position: relative;
            border: 1px solid #ffd1dc;
        }
        .delete-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ff4b72;
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-size: 12px;
            line-height: 25px;
            text-align: center;
            padding: 0;
        }
        #notesGrid, #imageGallery {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>موقعنا المميز ❤️</h1>

        <!-- قسم الملاحظات والكتابة -->
        <div class="section">
            <h2>إضافة ملاحظة أو رسالة</h2>
            <input type="text" id="noteTitle" placeholder="عنوان الرسالة...">
            <textarea id="noteContent" placeholder="اكتب كلامك هنا..."></textarea>
            <button onclick="saveNote()">حفظ الرسالة</button>
            <div id="notesGrid"></div>
        </div>

        <!-- قسم الصور -->
        <div class="section">
            <h2>صور الذكريات</h2>
            <input type="file" id="imageInput" accept="image/*" multiple onchange="uploadImages(event)">
            <div id="imageGallery"></div>
        </div>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات فايربيس الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSy...", // استبدلهم بالبيانات الخاصة بمشروعك لو لم تكن مربوطة في ملف خارجي
            authDomain: "my-love-app-c8f35.firebaseapp.com",
            projectId: "my-love-app-c8f35",
            storageBucket: "my-love-app-c8f35.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // جعل الدوال متاحة عالمياً في الصفحة
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.doc = doc;

        // دالة حفظ الملاحظات
        window.saveNote = async function() {
            const titleInput = document.getElementById('noteTitle');
            const contentInput = document.getElementById('noteContent');
            
            if (!titleInput.value || !contentInput.value) {
                alert('برجاء كتابة العنوان والمحتوى');
                return;
            }

            try {
                await addDoc(collection(db, "notes"), {
                    title: titleInput.value,
                    content: contentInput.value,
                    timestamp: Date.now()
                });
                titleInput.value = '';
                contentInput.value = '';
                loadNotes();
            } catch (error) {
                console.error("خطأ في حفظ الملاحظة:", error);
            }
        };

        // دالة تحميل الملاحظات
        window.loadNotes = async function() {
            const grid = document.getElementById('notesGrid');
            if (!grid) return;
            
            grid.innerHTML = '';
            try {
                const querySnapshot = await getDocs(collection(db, "notes"));
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'note-card';
                    card.innerHTML = `
                        <button class="delete-btn" onclick="deleteNote('${docSnap.id}')">X</button>
                        <h3>${data.title}</h3>
                        <p>${data.content}</p>
                    `;
                    grid.prepend(card);
                });
            } catch (error) {
                console.error("خطأ في تحميل الملاحظات:", error);
            }
        };

        // دالة حذف الملاحظة
        window.deleteNote = async function(id) {
            try {
                await deleteDoc(doc(db, "notes", id));
                loadNotes();
            } catch (error) {
                console.error("خطأ في حذف الملاحظة:", error);
            }
        };

        // دالة رفع الصور
        window.uploadImages = async function(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            for (let file of files) {
                const reader = new FileReader();
                reader.onload = async function(event) {
                    try {
                        await addDoc(collection(db, "images"), {
                            url: event.target.result,
                            timestamp: Date.now()
                        });
                        loadImages();
                    } catch (error) {
                        console.error("خطأ في رفع الصورة:", error);
                    }
                };
                reader.readAsDataURL(file);
            }
        };

        // دالة تحميل الصور
        window.loadImages = async function() {
            const gallery = document.getElementById('imageGallery');
            if (!gallery) return;

            gallery.innerHTML = '';
            try {
                const querySnapshot = await getDocs(collection(db, "images"));
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const imgCard = document.createElement('div');
                    imgCard.className = 'image-card';
                    imgCard.innerHTML = `
                        <button class="delete-btn" onclick="deleteImage('${docSnap.id}')">X</button>
                        <img src="${data.url}" alt="صورة مرفوعة" style="max-width:100%; border-radius:8px; display:block; margin-top:5px;">
                    `;
                    gallery.prepend(imgCard);
                });
            } catch (error) {
                console.error("خطأ في تحميل الصور:", error);
            }
        };
